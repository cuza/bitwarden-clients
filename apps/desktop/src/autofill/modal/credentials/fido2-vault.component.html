<app-fido2-modal-page>
  <app-fido2-modal-header
    slot="header"
    [pageTitle]="titleKey | i18n"
    (closeModal)="closeModal()"
  ></app-fido2-modal-header>

  <bit-section>
    <bit-search
      id="fido2-vault_input_search"
      class="tw-mb-4 tw-block"
      [formControl]="search"
      [placeholder]="'search' | i18n"
    />
    @let ciphers = ciphers$ | async;
    @if (ciphers?.length) {
      <bit-section-header>
        <h2 bitTypography="h6">{{ headingKey | i18n }}</h2>
      </bit-section-header>
    }
    @for (c of ciphers; track c.id) {
      <bit-item>
        <button type="button" bit-item-content (click)="chooseCipher(c)">
          <app-vault-icon [cipher]="c" slot="start"></app-vault-icon>
          <span [title]="c.name">{{ c.name }}</span>
          <span slot="secondary">{{ CipherViewLikeUtils.subtitle(c) }}</span>
          <span bitBadge slot="end">{{ "select" | i18n }}</span>
        </button>
      </bit-item>
    } @empty {
      @if (search.value) {
        <p bitTypography="body2" class="tw-text-fg-body-subtle">{{ "noItemsInList" | i18n }}</p>
      }
    }
  </bit-section>
</app-fido2-modal-page>
