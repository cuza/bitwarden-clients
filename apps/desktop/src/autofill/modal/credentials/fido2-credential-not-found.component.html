<app-fido2-modal-page>
  <app-fido2-modal-header
    slot="header"
    [pageTitle]="(session?.loginFill ? 'autofillLogin' : 'passkeyLogin2') | i18n"
    (closeModal)="closeModal()"
  ></app-fido2-modal-header>

  <bit-status-lockup>
    <bit-svg slot="graphic" [content]="Icons.NoResults"></bit-svg>
    <ng-container slot="title">{{
      (session?.loginFill ? "noLoginsFoundToAutofill" : "noPasskeysFoundForThisApplication") | i18n
    }}</ng-container>
    <button bitButton buttonType="primary" slot="button" type="button" (click)="closeModal()">
      {{ "close" | i18n }}
    </button>
  </bit-status-lockup>
</app-fido2-modal-page>
